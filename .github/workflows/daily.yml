name: US Market Tower Daily

on:
  schedule:
    - cron: '35 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: ① 데이터 수집
        run: python collect_data.py

      # - name: ② Claude 해석글 생성
      #   env:
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #   run: python generate_report.py
      #
      # - name: ③ HTML 조립
      #   run: python build_html.py

      - name: ④ 결과 커밋 (Pages 자동 배포)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_*.json gap_history.json
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%d) UTC"
          git push
